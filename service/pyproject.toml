[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mono-service"
version = "0.1.0"
description = "Service layer package"
requires-python = ">=3.11"
dependencies = [
  "mono-core",
  "mono-utils"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv.sources]
mono-core = { path = "../core", editable = true }
mono-utils = { path = "../utils", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/mono_service"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
