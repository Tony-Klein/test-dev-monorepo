[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "mono-core"
version = "0.1.0"
description = "Core primitives for the monorepo"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mono_core"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
